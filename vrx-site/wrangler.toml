# Cloudflare Pages: CDN global, TLS 1.3, WAF e mitigação de DDoS na borda.
name = "vrx-site"
pages_build_output_dir = "./dist"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Armazenamento de consentimentos, pedidos de orçamento e pedidos LGPD
# (orçamentos e pedidos LGPD são criptografados com AES-256-GCM antes de salvar).
# Crie com:  npx wrangler kv namespace create VRX_KV  e cole o id abaixo.
[[kv_namespaces]]
binding = "VRX_KV"
id = "SUBSTITUA_PELO_ID_DO_NAMESPACE"

# Variáveis NÃO secretas. Segredos (CHAVE_CRIPTOGRAFIA, TURNSTILE_SECRET, WEBHOOK_SECRET,
# SALT_IP) vão no painel: Pages > Settings > Variables and Secrets (tipo "Secret").
[vars]
# Webhook do CRM / automação de e-mail que recebe os pedidos de orçamento
WEBHOOK_ORCAMENTO_URL = ""
# Webhook do sistema de chamados que recebe os pedidos LGPD
WEBHOOK_TITULAR_URL = ""
