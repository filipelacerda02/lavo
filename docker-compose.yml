# Sobe o CRM (com o agente) usando a Cloud API oficial do WhatsApp.
#   cp .env.example .env   # preencha ANTHROPIC_API_KEY e as variáveis WHATSAPP_*
#   docker compose up -d   # o CRM fica em http://localhost:8000
# O webhook da Meta precisa de HTTPS público: coloque um proxy reverso (Caddy, Nginx, Cloudflare Tunnel)
# apontando https://seu-dominio/ para a porta 8000 e cadastre https://seu-dominio/api/whatsapp/webhook na Meta.
services:
  crm:
    build: .
    env_file: .env
    environment:
      CRM_DADOS: /dados
      LAVO_VETORES: /dados/vetores
      LAVO_TRACES: /dados/traces
    volumes:
      - crm-dados:/dados
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  crm-dados:
