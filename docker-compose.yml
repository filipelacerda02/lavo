# Sobe o CRM (com o agente) e o gateway do WhatsApp.
#   cp .env.example .env   # preencha ANTHROPIC_API_KEY e WHATSAPP_GATEWAY_TOKEN
#   docker compose up -d   # abra http://localhost:8000
services:
  crm:
    build: .
    env_file: .env
    environment:
      WHATSAPP_GATEWAY_URL: http://whatsapp:3001
      CRM_DADOS: /dados
      LAVO_VETORES: /dados/vetores
      LAVO_TRACES: /dados/traces
    volumes:
      - crm-dados:/dados
    ports:
      - "8000:8000"
    depends_on: [whatsapp]
    restart: unless-stopped

  whatsapp:
    build: ./whatsapp-gateway
    environment:
      GATEWAY_TOKEN: ${WHATSAPP_GATEWAY_TOKEN}
      CRM_WEBHOOK_URL: http://crm:8000/api/whatsapp/webhook
      PASTA_SESSAO: /sessao
    volumes:
      - whatsapp-sessao:/sessao   # credenciais do WhatsApp: trate como senha
    restart: unless-stopped

volumes:
  crm-dados:
  whatsapp-sessao:
