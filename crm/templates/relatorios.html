{% extends "base.html" %}
{% block cabeca %}<script src="/static/vendor/apexcharts-8.8.2.min.js"></script>{% endblock %}
{% block conteudo %}
<div class="conteudo" x-data="relatorios()" x-init="carregar()">
  <div class="chips" style="margin-bottom:16px">
    <template x-for="d in [1, 7, 30, 90]" :key="d">
      <button class="chip" :class="dias === d ? 'ativo' : ''" @click="dias = d; carregar()" x-text="d === 1 ? 'Hoje' : 'Últimos ' + d + ' dias'"></button>
    </template>
  </div>
  <template x-if="r">
    <div class="coluna" style="gap:16px">
      <div class="faixa-numeros">
        <div><div class="rotulo">Conversas novas</div><div class="numero-grande" x-text="r.conversas_novas"></div>
          <div class="fraco" x-text="r.com_humano + ' com participação da equipe'"></div></div>
        <div><div class="rotulo">Só o agente atendeu</div><div class="numero-grande" x-text="r.conversas_novas ? Math.round(100 * r.sem_humano / r.conversas_novas) + '%' : '—'"></div>
          <div class="fraco" x-text="r.sem_humano + ' conversas'"></div></div>
        <div><div class="rotulo">Primeira resposta</div><div class="numero-grande" x-text="fmt.duracao(r.tempo_primeira_resposta_s)"></div>
          <div class="fraco">tempo médio</div></div>
        <div><div class="rotulo">Satisfação</div><div class="numero-grande" x-text="r.csat.media !== null ? r.csat.media.toFixed(1) : '—'"></div>
          <div class="fraco" x-text="r.csat.respostas + ' de ' + r.csat.solicitadas + ' responderam'"></div></div>
        <div><div class="rotulo">Resolvidas no prazo</div><div class="numero-grande" x-text="r.sla.resolvidas_no_prazo_pct !== null ? r.sla.resolvidas_no_prazo_pct + '%' : '—'"></div>
          <div class="fraco" x-text="r.sla.estouradas_agora + ' abertas com prazo estourado'"></div></div>
        <div><div class="rotulo">Custo do agente</div><div class="numero-grande" x-text="'US$ ' + r.custo_agente_usd.toFixed(2)"></div>
          <div class="fraco" x-text="r.mensagens_agente + ' respostas'"></div></div>
      </div>

      <div class="cartao">
        <div class="linha entre"><h2 style="margin:0">Quem respondeu, dia a dia</h2>
          <div class="legenda"><span><i style="background:var(--agente)"></i>Agente</span><span><i style="background:var(--humano)"></i>Equipe</span></div></div>
        <div x-ref="grafico" style="min-height:290px; margin-top:6px" role="img" :aria-label="'Mensagens por dia nos últimos ' + dias + ' dias'"></div>
        <details style="margin-top:10px"><summary class="fraco">Ver como tabela</summary>
          <table class="tabela"><thead><tr><th>Dia</th><th>Agente</th><th>Humanos</th></tr></thead>
            <tbody><template x-for="d in r.por_dia" :key="d.dia"><tr><td x-text="fmt.data(d.dia + 'T12:00')"></td><td x-text="d.agente"></td><td x-text="d.humano"></td></tr></template></tbody></table>
        </details>
      </div>

      <div class="grade grade-2">
        <div class="cartao">
          <h2>Notas da pesquisa de satisfação</h2>
          <template x-for="n in ['5', '4', '3', '2', '1']" :key="n">
            <div class="linha" style="flex-wrap:nowrap; margin-bottom:6px">
              <span style="width:70px" class="estrelas" x-text="'★'.repeat(Number(n))"></span>
              <div style="flex:1; background:var(--superficie-2); border-radius:4px">
                <div class="barra-h" :style="'width:' + (r.csat.respostas ? 100 * r.csat.distribuicao[n] / r.csat.respostas : 0) + '%'"></div></div>
              <span style="width:32px; text-align:right" x-text="r.csat.distribuicao[n]"></span>
            </div>
          </template>
          <div class="vazio" x-show="!r.csat.respostas" style="padding:12px">Nenhuma avaliação no período.</div>
        </div>
        <div class="cartao tabela-rolagem">
          <h2>Satisfação por quem atendeu</h2>
          <table class="tabela"><thead><tr><th>Quem</th><th>Média</th><th>Avaliações</th></tr></thead>
            <tbody><template x-for="u in r.csat.por_usuario" :key="u.nome"><tr><td x-text="u.nome"></td><td x-text="u.media.toFixed(1)"></td><td x-text="u.respostas"></td></tr></template></tbody></table>
          <div class="vazio" x-show="!r.csat.por_usuario.length" style="padding:12px">Sem dados.</div>
        </div>
      </div>

      <div class="cartao tabela-rolagem">
        <h2>Atendimento humano por colaborador</h2>
        <table class="tabela">
          <thead><tr><th>Colaborador</th><th>Mensagens</th><th>Conversas atendidas</th><th>Resolvidas</th></tr></thead>
          <tbody><template x-for="u in r.por_usuario" :key="u.nome">
            <tr><td x-text="u.nome"></td><td x-text="u.mensagens"></td><td x-text="u.conversas"></td><td x-text="u.resolvidas"></td></tr>
          </template></tbody>
        </table>
        <div class="vazio" x-show="!r.por_usuario.length">Nenhum atendimento humano no período.</div>
      </div>
    </div>
  </template>
</div>
<script>
function relatorios() {
  return {
    dias: 7, r: null, grafico: null,
    async carregar() {
      this.r = await api('/api/relatorios/resumo?dias=' + this.dias)
      this.$nextTick(() => this.desenhar())
    },
    desenhar() {
      if (!window.ApexCharts || !this.$refs.grafico) return
      const css = getComputedStyle(document.documentElement), cor = (v) => css.getPropertyValue(v).trim()
      const dias = this.r.por_dia
      const opcoes = {
        chart: { type: 'bar', height: 300, stacked: true, toolbar: { show: false }, fontFamily: cor('--fonte'),
                 animations: { enabled: !matchMedia('(prefers-reduced-motion: reduce)').matches, speed: 450 } },
        series: [{ name: 'Agente', data: dias.map((d) => d.agente) }, { name: 'Equipe', data: dias.map((d) => d.humano) }],
        colors: [cor('--agente'), cor('--humano')],
        plotOptions: { bar: { columnWidth: dias.length > 20 ? '70%' : '42%', borderRadius: 4, borderRadiusApplication: 'end', borderRadiusWhenStacked: 'last' } },
        stroke: { show: true, width: 2, colors: [cor('--superficie')] },
        xaxis: { categories: dias.map((d) => d.dia.slice(8, 10) + '/' + d.dia.slice(5, 7)), axisBorder: { show: false }, axisTicks: { show: false },
                 labels: { style: { colors: cor('--texto-3') }, hideOverlappingLabels: true, rotate: 0 }, tickAmount: Math.min(dias.length, 12) },
        yaxis: { labels: { style: { colors: cor('--texto-3') }, formatter: (v) => Math.round(v) } },
        grid: { borderColor: cor('--borda'), strokeDashArray: 4 }, legend: { show: false }, dataLabels: { enabled: false },
        tooltip: { theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light', y: { formatter: (v) => v + ' mensagens' } },
      }
      if (this.grafico && document.body.contains(this.grafico.el)) this.grafico.updateOptions(opcoes)
      else { this.grafico = new ApexCharts(this.$refs.grafico, opcoes); this.grafico.render() }
    },
  }
}
</script>
{% endblock %}
