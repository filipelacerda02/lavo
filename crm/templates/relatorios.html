{% extends "base.html" %}
{% block conteudo %}
<div class="conteudo" x-data="relatorios()" x-init="carregar()">
  <div class="chips" style="margin-bottom:16px">
    <template x-for="d in [1, 7, 30, 90]" :key="d">
      <button class="chip" :class="dias === d ? 'ativo' : ''" @click="dias = d; carregar()" x-text="d === 1 ? 'Hoje' : 'Últimos ' + d + ' dias'"></button>
    </template>
  </div>
  <template x-if="r">
    <div class="coluna" style="gap:16px">
      <div class="grade grade-4">
        <div class="cartao"><div class="fraco">Conversas novas</div><div class="numero-grande" x-text="r.conversas_novas"></div></div>
        <div class="cartao"><div class="fraco">Atendidas só pelo agente</div><div class="numero-grande" x-text="r.sem_humano"></div>
          <div class="fraco" x-text="r.conversas_novas ? Math.round(100 * r.sem_humano / r.conversas_novas) + '% das conversas' : ''"></div></div>
        <div class="cartao"><div class="fraco">Com participação humana</div><div class="numero-grande" x-text="r.com_humano"></div></div>
        <div class="cartao"><div class="fraco">1ª resposta (média)</div><div class="numero-grande" x-text="fmt.duracao(r.tempo_primeira_resposta_s)"></div></div>
        <div class="cartao"><div class="fraco">Custo do agente</div><div class="numero-grande" x-text="'US$ ' + r.custo_agente_usd.toFixed(2)"></div></div>
        <div class="cartao"><div class="fraco">Satisfação (CSAT)</div>
          <div class="numero-grande" x-text="r.csat.media !== null ? r.csat.media.toFixed(1) + ' / 5' : '—'"></div>
          <div class="fraco" x-text="r.csat.respostas + ' de ' + r.csat.solicitadas + ' responderam' + (r.csat.satisfeitos_pct !== null ? ' · ' + r.csat.satisfeitos_pct + '% satisfeitos (4–5)' : '')"></div></div>
        <div class="cartao"><div class="fraco">Resolvidas dentro do SLA</div>
          <div class="numero-grande" x-text="r.sla.resolvidas_no_prazo_pct !== null ? r.sla.resolvidas_no_prazo_pct + '%' : '—'"></div>
          <div class="fraco" x-text="r.sla.estouradas_agora + ' conversa(s) abertas com SLA estourado'"></div></div>
      </div>

      <div class="grade grade-2">
        <div class="cartao">
          <h2>Notas da pesquisa de satisfação</h2>
          <template x-for="n in ['5', '4', '3', '2', '1']" :key="n">
            <div class="linha" style="flex-wrap:nowrap; margin-bottom:6px">
              <span style="width:70px" class="estrelas" x-text="'★'.repeat(Number(n))"></span>
              <div style="flex:1; background:var(--superficie-2); border-radius:4px">
                <div class="barra-h" :style="'width:' + (r.csat.respostas ? 100 * r.csat.distribuicao[n] / r.csat.respostas : 0) + '%'"></div></div>
              <span style="width:32px; text-align:right" x-text="r.csat.distribuicao[n]"></span>
            </div>
          </template>
          <div class="vazio" x-show="!r.csat.respostas" style="padding:12px">Nenhuma avaliação no período.</div>
        </div>
        <div class="cartao tabela-rolagem">
          <h2>Satisfação por quem atendeu</h2>
          <table class="tabela"><thead><tr><th>Quem</th><th>Média</th><th>Avaliações</th></tr></thead>
            <tbody><template x-for="u in r.csat.por_usuario" :key="u.nome"><tr><td x-text="u.nome"></td><td x-text="u.media.toFixed(1)"></td><td x-text="u.respostas"></td></tr></template></tbody></table>
          <div class="vazio" x-show="!r.csat.por_usuario.length" style="padding:12px">Sem dados.</div>
        </div>
      </div>

      <div class="cartao">
        <div class="linha entre"><h2 style="margin:0">Mensagens enviadas por dia: agente x humanos</h2>
          <div class="legenda"><span><i style="background:var(--agente)"></i>🤖 Agente</span><span><i style="background:var(--humano)"></i>👤 Humanos</span></div></div>
        <div class="grafico" style="margin-top:12px" role="img" :aria-label="'Mensagens por dia nos últimos ' + dias + ' dias'">
          <template x-for="d in r.por_dia" :key="d.dia">
            <div class="barra" @mouseenter="dica = d.dia" @mouseleave="dica = null">
              <div class="seg agente" :style="'height:' + (100 * d.agente / maximo()) + '%'"></div>
              <div class="seg humano" :style="'height:' + (100 * d.humano / maximo()) + '%'"></div>
              <div class="dica" x-show="dica === d.dia" x-text="fmt.data(d.dia + 'T12:00') + ' · agente ' + d.agente + ' · humanos ' + d.humano"></div>
            </div>
          </template>
        </div>
        <div class="eixo"><template x-for="(d, i) in r.por_dia" :key="d.dia"><span x-text="(r.por_dia.length <= 10 || i % Math.ceil(r.por_dia.length / 10) === 0) ? d.dia.slice(8, 10) + '/' + d.dia.slice(5, 7) : ''"></span></template></div>
        <details style="margin-top:10px"><summary class="fraco">Ver como tabela</summary>
          <table class="tabela"><thead><tr><th>Dia</th><th>Agente</th><th>Humanos</th></tr></thead>
            <tbody><template x-for="d in r.por_dia" :key="d.dia"><tr><td x-text="fmt.data(d.dia + 'T12:00')"></td><td x-text="d.agente"></td><td x-text="d.humano"></td></tr></template></tbody></table>
        </details>
      </div>

      <div class="cartao tabela-rolagem">
        <h2>Atendimento humano por colaborador</h2>
        <table class="tabela">
          <thead><tr><th>Colaborador</th><th>Mensagens</th><th>Conversas atendidas</th><th>Resolvidas</th></tr></thead>
          <tbody><template x-for="u in r.por_usuario" :key="u.nome">
            <tr><td x-text="u.nome"></td><td x-text="u.mensagens"></td><td x-text="u.conversas"></td><td x-text="u.resolvidas"></td></tr>
          </template></tbody>
        </table>
        <div class="vazio" x-show="!r.por_usuario.length">Nenhum atendimento humano no período.</div>
      </div>
    </div>
  </template>
</div>
<script>
function relatorios() {
  return {
    dias: 7, r: null, dica: null,
    async carregar() { this.r = await api('/api/relatorios/resumo?dias=' + this.dias) },
    maximo() { return Math.max(1, ...this.r.por_dia.map((d) => d.agente + d.humano)) },
  }
}
</script>
{% endblock %}
